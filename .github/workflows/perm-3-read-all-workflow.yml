# Scenario 3: `permissions: read-all` at the workflow level.
#
# `read-all` is a shorthand that grants READ access to every permission scope
# simultaneously.  No write operations are permitted unless a job explicitly
# widens a specific scope to `write`.
#
# This is a common baseline for read-only/audit workflows (e.g. dependency
# scanning, code analysis, release note generation).
#
# GitHub docs:
#   https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#permissions-for-the-github_token

name: "Perm 3 – Workflow-level read-all"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

# ── Every scope set to "read" ─────────────────────────────────────────────────
permissions: read-all

jobs:
  # ── Job A: inherits workflow read-all (no job-level override) ────────────────
  inherits-read-all:
    name: "Inherits workflow read-all"
    runs-on: ubuntu-latest
    steps:
      - name: Show environment and token capabilities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "======================================================"
          echo " Scenario : permissions: read-all at workflow level"
          echo "            no job-level override"
          echo " Expected : all read operations succeed;"
          echo "            write operations are denied"
          echo "======================================================"
          echo ""
          echo "--- Runtime context ---"
          echo "Repository : ${{ github.repository }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Event      : ${{ github.event_name }}"
          echo "Runner OS  : ${{ runner.os }}"
          echo ""
          echo "--- Token capability probes ---"
          echo ""

          probe() {
            local label="$1"; shift
            if "$@" >/dev/null 2>&1; then
              echo "  ✅  $label"
            else
              echo "  ❌  $label"
            fi
          }

          probe "metadata:read  – list repo topics" \
            gh api "/repos/${{ github.repository }}/topics" --jq '.names'

          probe "contents:read  – list repo refs" \
            gh api "/repos/${{ github.repository }}/git/refs"

          probe "issues:read    – list issues" \
            gh api "/repos/${{ github.repository }}/issues"

          probe "pull-requests:read – list PRs" \
            gh api "/repos/${{ github.repository }}/pulls"

          probe "actions:read   – list workflow runs" \
            gh api "/repos/${{ github.repository }}/actions/runs"

          probe "checks:read    – list check suites" \
            gh api "/repos/${{ github.repository }}/check-suites"

  # ── Job B: job narrows to just contents:read ─────────────────────────────────
  job-narrows-to-contents:
    name: "read-all workflow, job narrows to contents:read only"
    runs-on: ubuntu-latest
    permissions:
      contents: read        # ← explicitly restrict; other scopes become none
    steps:
      - name: Show environment and token capabilities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "======================================================"
          echo " Scenario : permissions: read-all at workflow level;"
          echo "            job narrows to  contents: read"
          echo " Expected : only contents:read succeeds; issues, PRs, etc. denied"
          echo "======================================================"
          echo ""
          echo "--- Runtime context ---"
          echo "Repository : ${{ github.repository }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Event      : ${{ github.event_name }}"
          echo ""
          echo "--- Token capability probes ---"
          echo ""

          probe() {
            local label="$1"; shift
            if "$@" >/dev/null 2>&1; then
              echo "  ✅  $label"
            else
              echo "  ❌  $label"
            fi
          }

          probe "metadata:read  – list repo topics" \
            gh api "/repos/${{ github.repository }}/topics" --jq '.names'

          probe "contents:read  – list repo refs" \
            gh api "/repos/${{ github.repository }}/git/refs"

          probe "issues:read    – list issues (NOT granted)" \
            gh api "/repos/${{ github.repository }}/issues"

          probe "pull-requests:read – list PRs (NOT granted)" \
            gh api "/repos/${{ github.repository }}/pulls"

  # ── Job C: job widens one scope to write ─────────────────────────────────────
  job-widens-issues-to-write:
    name: "read-all workflow, job widens issues to write"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write         # ← widen issues beyond workflow read-all
    steps:
      - name: Show environment and token capabilities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "======================================================"
          echo " Scenario : permissions: read-all at workflow level;"
          echo "            job sets  contents: read, issues: write"
          echo " Expected : contents read OK; issues read+write OK;"
          echo "            other scopes denied (job overrides workflow)"
          echo "======================================================"
          echo ""
          echo "--- Runtime context ---"
          echo "Repository : ${{ github.repository }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Event      : ${{ github.event_name }}"
          echo ""
          echo "--- Token capability probes ---"
          echo ""

          probe() {
            local label="$1"; shift
            if "$@" >/dev/null 2>&1; then
              echo "  ✅  $label"
            else
              echo "  ❌  $label"
            fi
          }

          probe "metadata:read  – list repo topics" \
            gh api "/repos/${{ github.repository }}/topics" --jq '.names'

          probe "contents:read  – list repo refs" \
            gh api "/repos/${{ github.repository }}/git/refs"

          probe "issues:read    – list issues (granted via write)" \
            gh api "/repos/${{ github.repository }}/issues"

          probe "pull-requests:read – list PRs (NOT granted)" \
            gh api "/repos/${{ github.repository }}/pulls"

          echo ""
          echo "  ℹ️   issues:write is available but no destructive write"
          echo "      is performed in this probe step."
